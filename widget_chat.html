<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rasa Chatbot</title>

    <!-- Load Rasa Chat Widget -->
    <script
      type="module"
      src="https://unpkg.com/@rasahq/chat-widget-ui/dist/rasa-chatwidget/rasa-chatwidget.esm.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@rasahq/chat-widget-ui/dist/rasa-chatwidget/rasa-chatwidget.css"
    />
  </head>

  <body>
    <!-- Rasa Chatbot Widget -->
    <rasa-chatbot-widget
      server-url="http://192.168.1.217:5005/webhooks/rest/webhook"
      bot-name="Rasa Assistant"
      initial-message="Hi there! How can I help you today?"
      chat-title="Ask Me Anything"
      accent-color="#6C63FF"
    ></rasa-chatbot-widget>
  </body>
</html>
